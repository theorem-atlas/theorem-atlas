name: Erdős 92 candidate reductions
on:
  pull_request:
    paths:
      - 'research/erdos92-claude/**'
      - '.github/workflows/erdos92-claude.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record reproduction inputs
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          sha256sum research/erdos92-claude/*.lean > evidence/source-sha256.txt
      - name: Prepare pinned clean environment
        run: |
          set -o pipefail
          timeout --kill-after=15s 1200s docker build --platform linux/amd64 --progress plain -t atlas-erdos92 research/erdos92-claude 2>&1 | tee evidence/build.log
      - name: Compile candidate files offline
        run: |
          set -o pipefail
          result=0
          for file in GraphPruning GrowthReduction; do
            timeout --kill-after=10s 300s docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 6g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=256m --mount type=bind,src="$PWD/research/erdos92-claude/$file.lean",dst=/work/Candidate.lean,readonly atlas-erdos92 lake env lean /work/Candidate.lean 2>&1 | tee "evidence/$file.log" || result=1
          done
          exit "$result"
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: erdos92-candidates
          path: evidence/
          retention-days: 30
